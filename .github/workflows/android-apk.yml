name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "meshtastic-demo/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    tags:
      - "meshtastic-v*"
    paths:
      - "meshtastic-demo/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meshtastic-demo
    env:
      DEMO_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      EXPECTED_DEBUG_CERT_SHA256: 02deb30ff9f54751942495aad93d7d2f60b3c9330a58df2c3051e789f89bac2c

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            meshtastic-demo/*.gradle.kts
            meshtastic-demo/gradle.properties
            meshtastic-demo/gradle/wrapper/gradle-wrapper.properties

      - name: Restore conference signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "${DEMO_DEBUG_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/conference-debug.keystore"
          printf '%s' "${DEMO_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          printf 'DEMO_DEBUG_KEYSTORE_PATH=%s\n' "${keystore_path}" >> "${GITHUB_ENV}"

      - name: Verify conference signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          actual_fingerprint="$(
            keytool -J-Duser.language=en -list -v \
              -keystore "${DEMO_DEBUG_KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}'
          )"
          if [[ "${actual_fingerprint}" != "${EXPECTED_DEBUG_CERT_SHA256}" ]]; then
            echo "::error::Signing certificate ${actual_fingerprint} does not match the conference identity"
            exit 1
          fi
          echo "Conference signing certificate verified: ${actual_fingerprint}"

      - name: Test, lint, and build universal APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify built APK signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="$(command -v apksigner || true)"
          if [[ -z "${apksigner_path}" && -n "${sdk_root}" ]]; then
            apksigner_path="$(find "${sdk_root}/build-tools" -name apksigner -print | sort -V | tail -1)"
          fi
          if [[ -z "${apksigner_path}" || ! -x "${apksigner_path}" ]]; then
            echo "::error::Could not locate an executable apksigner"
            exit 1
          fi
          certificate_report="$(
            "${apksigner_path}" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>&1
          )"
          normalized_report="$(printf '%s\n' "${certificate_report}" | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "${certificate_report}"
          if [[ "${normalized_report}" != *"${EXPECTED_DEBUG_CERT_SHA256}"* ]]; then
            echo "::error::Built APK does not contain the conference signing certificate"
            exit 1
          fi
          echo "Built APK signing certificate verified: ${EXPECTED_DEBUG_CERT_SHA256}"

      - name: Prepare downloadable artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p build/conference-artifact
          artifact="build/conference-artifact/Meshtastic-Conference-Demo.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${artifact}"
          (
            cd build/conference-artifact
            sha256sum Meshtastic-Conference-Demo.apk > Meshtastic-Conference-Demo.apk.sha256
          )

      - name: Upload universal APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: meshtastic-conference-${{ github.ref_name }}-${{ github.sha }}
          path: |
            meshtastic-demo/build/conference-artifact/*.apk
            meshtastic-demo/build/conference-artifact/*.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish-release:
    name: Publish public APK release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Download verified APK
        uses: actions/download-artifact@v7
        with:
          name: meshtastic-conference-${{ github.ref_name }}-${{ github.sha }}
          path: release

      - name: Publish as the latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(
            sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' \
              meshtastic-demo/app/build.gradle.kts
          )"
          if [[ -z "${version}" ]]; then
            echo "::error::Could not determine the Android versionName"
            exit 1
          fi

          tag="meshtastic-v${version}-${GITHUB_SHA:0:7}"
          title="Meshtastic Conference Demo v${version} — Gateway clarity and Bitcoin relay"
          notes="meshtastic-demo/RELEASE_NOTES.md"
          apk="release/Meshtastic-Conference-Demo.apk"
          checksum="release/Meshtastic-Conference-Demo.apk.sha256"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${apk}" "${checksum}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --latest \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" "${apk}" "${checksum}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "${notes}" \
              --latest
          fi

          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Meshtastic-Conference-Demo.apk"
