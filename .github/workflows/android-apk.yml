name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "meshtastic-demo/**"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    tags:
      - "meshtastic-v*"
    paths:
      - "meshtastic-demo/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: meshtastic-demo
    env:
      DEMO_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            meshtastic-demo/*.gradle.kts
            meshtastic-demo/gradle.properties
            meshtastic-demo/gradle/wrapper/gradle-wrapper.properties

      - name: Restore conference signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ -z "${DEMO_DEBUG_KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          mkdir -p "${HOME}/.android"
          printf '%s' "${DEMO_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${HOME}/.android/debug.keystore"
          chmod 600 "${HOME}/.android/debug.keystore"

      - name: Test, lint, and build universal APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare downloadable artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p build/conference-artifact
          artifact="build/conference-artifact/Meshtastic-Conference-Demo-${GITHUB_SHA:0:12}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${artifact}"
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Upload universal APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: meshtastic-conference-${{ github.ref_name }}-${{ github.sha }}
          path: |
            meshtastic-demo/build/conference-artifact/*.apk
            meshtastic-demo/build/conference-artifact/*.sha256
          if-no-files-found: error
          retention-days: 30
